# Render Blueprint. Point Render at this repository and it reads this file, so
# the service is described here rather than clicked together in a dashboard.
#
# TLS, the domain and the PORT are Render's job - no reverse proxy is needed,
# which is why docker-compose.yml and the Caddyfile are unused on this host.
#
# Free plan reality: the service SUSPENDS after 15 minutes without traffic and
# takes ~1 minute to wake. The four @Scheduled jobs do not run while it sleeps,
# so WhatsApp delivery checks, the Google contacts reconciler and the
# external-effect outbox all stall until the next request wakes it. See
# DEPLOY.md for the ping that keeps it up.

services:
  - type: web
    name: center-api
    runtime: docker
    plan: free
    # Latency to the database dominates: several round trips to Supabase per
    # request, one to the browser. Match the Supabase project's region.
    region: frankfurt
    dockerfilePath: ./Dockerfile
    # Liveness, and deliberately not /api/health/ready: this endpoint answers
    # without touching the database, so a Supabase outage cannot make Render
    # tear down a process that is still serving its offline callers.
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # The image caps the heap at 75% of the container, which is right for
      # 1GB+ but not here: 75% of 512MB leaves ~128MB for metaspace, code cache
      # and thread stacks, and Spring Boot needs more than that - the process
      # dies at startup or on the first PDF. 55% is the trade this plan forces.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=55 -XX:+UseSerialGC -Djava.security.egd=file:/dev/./urandom"

      # 8 connections is sized for a machine with room. On 512MB and a shared
      # tenth of a CPU, each one is memory that the heap needs more.
      - key: DB_POOL_MAX
        value: "4"
      - key: DB_POOL_MIN_IDLE
        value: "1"
      - key: SCHEDULER_POOL_SIZE
        value: "2"
      - key: ASYNC_CORE_SIZE
        value: "2"
      - key: ASYNC_MAX_SIZE
        value: "4"

      # sync: false means "Render must not read a value from this file" - these
      # are set once in the dashboard and stay out of the repository.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GREEN_API_INSTANCE_ID
        sync: false
      - key: GREEN_API_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
