server:
  # Hosts (Railway, Render, Fly, ...) inject the port they routed to us. 8001 is
  # the local default the desktop shell also falls back to.
  port: ${PORT:8001}

  compression:
    # The API answers in list pages of up to 2000 rows, and a student row carries
    # a name, phone arrays and school text - one page is hundreds of kilobytes of
    # JSON that compresses to roughly a tenth of that. A few milliseconds of CPU
    # per response buys back far more than that on the wire.
    enabled: true
    mime-types: application/json,application/problem+json,text/html,text/css,application/javascript
    # Below this the gzip header costs more than the saving.
    min-response-size: 1024

spring:
  application:
    name: center-server

  profiles:
    default: dev

  config:
    # .env at the repo root holds the DB creds + secrets (gitignored). Plain
    # KEY=value. Production never reads it: the host supplies real environment
    # variables, and the import is optional so its absence is not an error.
    import: optional:file:./.env[.properties]

  datasource:
    # Supabase Session Pooler. The password is a separate property so it can
    # stay RAW — no URL-encoding, which is what used to break the old backend.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      # Raised from 5. The background jobs (WhatsApp monitor, WhatsApp recheck,
      # Google reconcile) now run alongside requests, and the Google one holds a
      # connection across slow calls out to Google. At 5, one reconcile pass
      # starved sign-in until it timed out after 30s. Overridable because a
      # 512MB host wants fewer: each connection is memory the heap needs more.
      maximum-pool-size: ${DB_POOL_MAX:8}
      # Hikari defaults minimumIdle to maximumPoolSize, which makes this a FIXED
      # pool: it opens every connection at boot and never releases an idle one.
      # Supabase's Session Pooler caps how many clients a project may hold, so a
      # burst of ten at startup - on top of anything the previous run leaked by
      # being killed rather than stopped - goes over that cap, and the pooler
      # answers by accepting the socket and closing it immediately. That is the
      # "This connection has been closed" thrown from PoolBase.setupConnection
      # before the app has finished booting.
      #
      # Two at boot, growing only under real load, stays well clear of it. It is
      # also what gives idle-timeout below any meaning: a fixed pool has no idle
      # connections to time out, which is why Hikari was warning about it.
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      # Supabase's pooler drops idle connections long before Hikari's 30-minute
      # default would retire them, so the pool kept handing out sockets the
      # server had already closed ("This connection has been closed"). Retire
      # them early, and keep the survivors warm.
      max-lifetime: 900000
      keepalive-time: 300000
      idle-timeout: 300000
      # Hikari's default is 30 SECONDS. When the machine loses its internet the
      # hosted database becomes unreachable, and every request then sat here for
      # a full 30s before failing - the browser froze on each screen in turn, and
      # the offline mirror (which could have answered instantly) was never
      # reached. Failing in 8s turns a dead database into a fast 503, which the
      # client treats as "offline" and serves locally.
      connection-timeout: 8000
      data-source-properties:
        # Supabase's pooler does not support server-side prepared statements.
        prepareThreshold: 0

  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway migrations — Hibernate must never touch it.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          # NO time_zone here, deliberately. It used to say UTC, and that setting
          # only ever reaches three JDBC types - TIME, DATE and plain TIMESTAMP -
          # by making Hibernate bind and read them through a UTC Calendar. This
          # schema has no plain TIMESTAMP at all (every one of them is
          # timestamptz, which carries its own offset and is not touched by
          # this), so the only columns it reached were the seven that are
          # deliberately zone-LESS: a group's start_time, and six dates.
          #
          # A wall-clock has no timezone, so converting it through one is not a
          # correction - it is a corruption whose size is the JVM's offset. On
          # the server that offset is zero (the container runs Etc/UTC) and the
          # bug was invisible. On a machine in Egypt a lesson stored as 10:00
          # read back as 12:00, and one typed as 16:00 was written as 14:00 into
          # the SAME shared database - so the desk saw the right time and the
          # server saw a different one. A birth date typed as 2010-05-03 was
          # stored as 2010-05-02.
          #
          # Removing it makes the binding symmetric on every machine. It changes
          # nothing on the server, where the UTC calendar and the default
          # calendar were already the same object's worth of offset.
          batch_size: 50
        order_inserts: true
        order_updates: true

  task:
    scheduling:
      # Four jobs are declared (@Scheduled) and the default pool is ONE thread,
      # so they ran strictly one after another: a slow Google reconcile pass
      # delayed the outbox drain, and a hung external call stopped all four
      # indefinitely. One thread each removes the coupling. Timeouts (app.http
      # below) are what bound the hang itself; this bounds the blast radius.
      pool:
        size: ${SCHEDULER_POOL_SIZE:4}
    execution:
      # @Async work (push fan-out, Google contact sync). Boot's default queue is
      # UNBOUNDED, so a stalled external service silently accumulates tasks -
      # and therefore heap - with no back pressure and no error. A bounded queue
      # plus CallerRunsPolicy makes the producer feel the stall instead.
      pool:
        core-size: ${ASYNC_CORE_SIZE:4}
        max-size: ${ASYNC_MAX_SIZE:8}
        queue-capacity: ${ASYNC_QUEUE_CAPACITY:500}

  servlet:
    multipart:
      # Explicit rather than inherited, so an upload limit is a decision on the
      # record instead of a framework default nobody chose.
      max-file-size: 10MB
      max-request-size: 12MB

  jackson:
    # The whole API contract is snake_case (student_phones, is_active, ...) and
    # the frontend already speaks it — do not change without changing src/.
    property-naming-strategy: SNAKE_CASE

  data:
    web:
      pageable:
        # Match the snake_case contract; ?page=&size=&sort=name,asc
        page-parameter: page
        size-parameter: size
        max-page-size: 2000
        one-indexed-parameters: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # The database already had every migration up to 13 applied (by the old
    # Python runner). Baseline adopts it as-is; only V14+ ever runs.
    baseline-on-migrate: true
    baseline-version: "13"
    baseline-description: "adopted from python run_migrations"

app:
  cors:
    # Browser origins allowed to call this API cross-origin (see CorsConfig).
    # Empty - the default - is same-origin only, which is how the Vite dev
    # proxy, the desktop shell and any reverse-proxied deployment all run.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  http:
    # Deadlines for every outbound call (see OutboundHttpConfig). Without them
    # RestClient waits forever, which is how one unresponsive third party used to
    # take request threads, Hikari connections and the scheduler with it.
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:20000}
    # A model completion is slow by nature; a 20s cap would fail every call.
    ai-read-timeout-ms: ${HTTP_AI_READ_TIMEOUT_MS:45000}

  limits:
    # Largest JSON body the API accepts. Sync pushes a batch of queued offline
    # writes, so this cannot be small - but unbounded means one client can ask
    # the server to buffer arbitrary bytes into heap before any handler runs.
    max-request-bytes: ${MAX_REQUEST_BYTES:5242880}

  jwt:
    secret: ${JWT_SECRET}
    # Sessions last until the user explicitly logs out — the clients persist the
    # token and restore it on launch, so the token must outlive the app install.
    ttl-hours: ${JWT_TTL_HOURS:87600}

  meta:
    # WhatsApp Cloud API (the official one, hosted by Meta) — the only way this
    # system sends WhatsApp. A blank token means no message can go out at all, and
    # every send button in the app reports itself unavailable rather than failing.
    #
    # Pin the Graph version. Meta ships breaking changes between versions and
    # keeps each one alive for ~2 years; "whatever is newest" is how a working
    # integration breaks on a morning nobody deployed anything.
    api-version: ${META_API_VERSION:v26.0}
    waba-id: ${META_WABA_ID:}
    app-id: ${META_APP_ID:}
    app-secret: ${META_APP_SECRET:}
    access-token: ${META_ACCESS_TOKEN:}
    webhook-verify-token: ${META_WEBHOOK_VERIFY_TOKEN:}
    enabled: ${META_ENABLED:true}
    # What Meta bills per message, by template category, in USD. These are the
    # Egypt rates at the time of writing and they DO change - the dashboard calls
    # anything computed from them "تقديري" for that reason. Override per country.
    #
    # Read them off WhatsApp Manager -> Insights -> Message pricing, and correct
    # them here when Meta republishes. A stale rate does not break anything, it
    # just makes the cost report quietly wrong in one direction - utility sat at
    # 0.0104 here long after Meta had dropped it to 0.0036, so every month's
    # figure read almost three times what was actually billed.
    rates:
      # Egypt, read off the Meta rate card effective 2026-07-01.
      #
      # marketing was 0.0736 here long after Meta dropped it to 0.0644 (Egypt got
      # lower marketing rates on 2026-01-01), and authentication was 0.0125
      # against a real 0.0036 - so every cost figure read roughly 3.5x what was
      # actually billed.
      #
      # DIARISE 2026-09-01. From 2026-10-01 Meta charges per message for SERVICE
      # and UTILITY messages, which are free today; the rates are published around
      # the first of September. The `service: 0` line below expires on that date.
      marketing: ${META_RATE_MARKETING:0.0644}
      utility: ${META_RATE_UTILITY:0.0036}
      authentication: ${META_RATE_AUTH:0.0036}
      # A reply sent inside the customer's own 24-hour window costs nothing -
      # until 2026-10-01.
      service: ${META_RATE_SERVICE:0}

    # ── Sending rate and the daily allowance ────────────────────────────────
    #
    # Meta allows 80 messages/second per number and caps the whole BUSINESS
    # PORTFOLIO at N unique recipients per rolling 24 hours - 250 until the
    # business is verified, then 2,000, 10,000 and up. Every teacher's number
    # sits in one portfolio, so they share one allowance.
    #
    # max-mps is far below Meta's 80 on purpose. Throughput has never been the
    # bottleneck here (a sequential loop manages about 3), and the value of the
    # pacer is that a rate is chosen deliberately and that there is somewhere for
    # a 130429 to register a pause - not that it makes anything faster.
    max-mps: ${META_MAX_MPS:8}
    burst: ${META_BURST:16}
    # How often the queue drain looks for work. Also kicked directly after a
    # send button is pressed, so this is the floor on latency, not the norm.
    drain-interval-ms: ${META_DRAIN_INTERVAL_MS:15000}
    # Wall-clock ceiling on one drain pass, so a broadcast never holds the shared
    # scheduler thread for its whole length.
    drain-budget-seconds: ${META_DRAIN_BUDGET_SECONDS:45}
    # Meta re-evaluates a messaging tier every 6 hours (it was 24 before Oct
    # 2025), so reading it more often spends the Graph request budget for nothing.
    quota-refresh-ms: ${META_QUOTA_REFRESH_MS:21600000}

  number-check:
    # Green API, and ONLY for asking "is this number on WhatsApp".
    #
    # Nothing is sent through it - no message, no card, no template. Every
    # message this system sends goes through Meta. Green is here because the
    # official API has no endpoint that answers this question and Meta will not
    # add one, and knowing a guardian is unreachable BEFORE the term starts is
    # worth an unofficial client that never touches a message.
    #
    # One instance for the whole platform: the answer is a property of the
    # number, so it is the same for every teacher and the cache is shared.
    # Blank credentials disable the check; nothing else stops working.
    #
    # An answer is kept for good - there is no re-check interval. A number is
    # asked about once and again only if it changes, because a roster only grows
    # and re-asking the whole thing on a timer turns a fixed cost into a
    # recurring one. WhatsappNumberCheckJob is what does the asking.
    #
    # Named GREEN_API_* and not GREEN_CHECK_*. Green used to SEND here, under
    # GREEN_API_*, and every .env on every machine still spells it that way. When
    # sending moved to Meta the remaining check was renamed in this file and
    # nowhere else, so the credentials sat in .env under the old names, the app
    # read the new ones, found blank, and disabled the check - silently, because
    # blank is also how you turn it off on purpose. Reading the names that are
    # actually out there is what makes existing installs work untouched.
    base-url: ${GREEN_API_BASE_URL:https://api.green-api.com}
    instance-id: ${GREEN_API_INSTANCE_ID:}
    token: ${GREEN_API_TOKEN:}
    enabled: ${GREEN_API_ENABLED:true}

  google:
    # Google Contacts (People API) sync. OAuth client from .env; the secret must
    # never live in .env.example or source.
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5174/}

  registration:
    # Verification code lifetime and abuse limits.
    code-ttl-minutes: 5
    max-attempts: 5
    max-sends-per-hour: 3

  security:
    # Brute-force protection for the password endpoints. Counted in memory, so
    # these limits are per running instance.
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      per-ip-max-attempts: ${LOGIN_MAX_ATTEMPTS_PER_IP:20}
      window-minutes: ${LOGIN_WINDOW_MINUTES:15}
      lock-minutes: ${LOGIN_LOCK_MINUTES:15}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        # Only what is actually read. `metrics` carries http.server.requests
        # (count + latency + status), hikaricp.connections.* (pool usage and
        # threads waiting), jvm.memory.*, and process.cpu.usage - the four
        # things needed to tell "the app is slow" apart from "the database is
        # slow" from "we ran out of connections".
        include: health,info,metrics
  endpoint:
    health:
      # Component detail (db, diskSpace, ping) only for an authenticated caller;
      # these endpoints sit behind the same auth as the rest of the API.
      show-details: when-authorized
  metrics:
    tags:
      application: center-server
  observations:
    key-values:
      application: center-server

logging:
  level:
    com.center: info
